name: Fast Regression Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run Phase 4.3 Fast Gate
        run: python3 scripts/run_gate.py --mode fast
      - name: Upload Fast Gate Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-fast-report
          path: report/*-phase-4-fast.txt
